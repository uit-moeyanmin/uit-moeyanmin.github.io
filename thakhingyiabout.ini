ဝင်းကိုကိုလတ်သည် အာဏာသိမ်းပြီးနောက် အမျိုးသားရေးလှုပ်ရှားမှုများကို ရပ်တန့်ပြီး သွေးသောက် အဖွဲ့ကဲ့သို့သော လက်နက်ကိုင်၍ ပြည်သူများကို သတ်ဖြတ်မှုများစွာတွင် ါပဝင်ပတ်သက်နေသည်။  အစွန်းရောက် လှုပ်ရှားမှုများဖြင့် တိုင်းပြည်ကို အမျိုးမျိုး ဖျက်ဆီးကြသူများတွင် ကိုလတ်(ခ) ဝင်းကိုကိုလတ်၏ အမည်မှာ လုံး၀ မပျက်ပြယ်တော့သည့် သမိုင်းတရားခံတစ်ဦးအဖြစ် တည်ရှိနေပြီဖြစ်သည်။