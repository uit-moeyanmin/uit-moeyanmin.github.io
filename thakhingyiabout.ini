
မဘသနှင့်အမျိုးသားရေး အစွန်းရောက် လှုပ်ရှားမှုများဖြင့် တိုင်းပြည်ဖျက် ခဲ့သော  ဝင်းကိုကိုလတ် (သို့မဟုတ်) အပြာစာရေးဆရာဘ၀မှ အမျိုးသားရေး အစွန်း ရောက် ဖြစ်လာသူ

By ဟိဏ်းဝေယံ

မြန်မာနိုင်ငံမှာ ဒီမိုကရေစီ ရောင်ခြည်ဦး အနည်းငယ် ကွန့်မြူးကာစ အချိန် ၂၀၁၂ ခုနှစ်မှစတင်ပြီး နိုင်ငံတော်ကို အမျိုး၊ ဘာသာ ၊ သာသနာ အစွန်း ရောက် လှုပ်ရှားမှုများဖြင့် တိုင်းပြည်ဖျက်ခဲ့သူများ စွာအနက်တွင် အမျိုးသားရေး အစွန်းရောက် ဝင်းကိုကိုလတ်လည်းပါဝင်ခဲ့သည်။ 

သခင်ကြီး ဘ၀ အစ ဖိုးလောင်တီးက 
======================

သခင်ကြီး(ခ) စွေစောင်း(ခ) ဝင်းကိုကိုလတ် သည် အဓိကအားဖြင့် အမျိုးသား ရေး အစွန်းရောက်ကို အမည်ခံ၍ စစ်တပ် ထောက်ခံခြင်း၊ ဘာသာရေး အစွန်းရောက်ပြခြင်းဖြင့် ငွေကြေးလုပ်စားသူ ဖြစ် ကြောင်း ၎င်း၏ ဘ၀ ဇတ်ကြောင်းကို သိရှိလျှင် ပို၍ သိသာနိုင်ပါသည်။ 

အမျိုးသားရေးဟု ဟစ်ကြွေး၍  စစ်တပ် ၊ ကြံ့ဖွတ်ခင်ရီ နှင့် အေးနေဝင်းတို့ထံမှ ရရှိလာသော ငွေကြေးများဖြင့် အချောင် နေထိုင်စားသောက်လို့ရသဖြင့် လုပ်နေခြင်း လည်းဖြစ်သည်။ 

 ဝင်းကိုကိုလတ်၏ မူလ ပထမ အလုပ်သည်  `ဖိုးလောင်တီး´ အမည်ဖြင့်   အပြာစာပေများကို website ဖွင့်ပြီး ရေးသားခြင်းဖြစ်ပြီး  အွန်းလိုင်းပေါ်မှ တစ်ဆင့်  ပြည့်တန်ဆာ ချိတ်ဆက်ပေးသည့် အလုပ်လုပ်ကိုင်ခဲ့ခြင်းဖြစ်သည်။ 

ထို့နောက် ဝီရသူက မျက်စိကျပြီး ဝီရသူ၏ လမ်းညွှန်မှုဖြင့် သူ၏ ကလောင် နာမည် အပြာစာရေးဆရာ "ဖိုးလောင်တီး" ကို နာမည်ပြောင်းကာ "ဖိုးလောင် ထူး"  နာမည်ဖြင့် အမျိုးသားရေး စာပေဆိုသော အစွန်းရောက် စာများကို ရေးသားသည်။  ဝီရသူ လမ်းညွှန်မှုဖြင့်  အပြာစာရေးဆရာဘ၀မှ အမျိုးသားရေး အစွန်းရောက် ဘ၀ ခံယူသူလည်းဖြစ်သည်။ 

အမျိုးသားရေးအစွန်းရောက်  ဝီရသူကိုယ်တိုင်က  သူ့တပည့် ကိုလတ် (ဝင်းကိုကိုလတ်) တို့လင်မယားက ပြည့်တန်ဆာခေါင်းလုပ်ကြောင်း ဝန်ခံ ပြောဆိုခဲ့ပြီး  အမျိုးသားရေး လှုပ်ရှားမှုများ လုပ်ချိန်တွင် ပြည့်တန်ဆာ ခေါင်း အလုပ်ကို စွန့်လွှတ်ခဲ့ပြီးဖြစ်ကြောင်း လူမှုကွန်ရက် Facebook Live တစ်ခု (ယခု ၂၀၂၂ ခုနှစ်) အတွင်း ထုတ်ဖော်ပြော ဆိုသွားသည်။

အမျိုးသားရေးအစွန်းရောက်ဖြစ်လာချိန်တွင် ဝင်းကိုကိုလတ်သည်  တိုက်ပုံ အမည်း မချွတ်တော့ဘဲ သူ့ကိုယ်သူ ရှေ့နေအယောင်ဆောင်ခဲ့သည်။ 

တစ်လင်တစ်ယား မျိုးစောင့်ဥပဒေကို ထောက်ခံသော မယား ၄ ဦးရှိသူ
========================================

ဝင်းကိုကိုလတ်သည် တစ်လင်တစ်ယား ဖြစ်စေရန် ရည်ရွယ်ပြဋ္ဌာန်းထားသော  မျိုးစောင့်ဥပဒေ ကို ထောက်ခံပွဲများ ဦးဆောင်ကျင်းပခဲ့သော်လည်း ၎င်းကိုယ်တိုင်က  တစ်လင်တစ်မယား စနစ်ကို မလိုက်နာဘဲ မိန်းမ ၄ ဦးယူခဲ့သည်။ 

စွေစောင်း(ခ) ဝင်းကိုကိုလတ်သည်  အမျိုးသားရေး အစွန်းရောက်လှုပ်ရှားမှုများ အစပျိုးချိန်တွင် အစွန်းရောက် အမျိုးသားရေး လှုပ်ရှားသူ  မွန်မင်းသမီး ဟု မိမိကိုယ်ကို သုံးနှုန်းနေသူနှင့် ပေါင်းသင်းခဲ့ကာ မအောင်မြင်ချိန်ကာ အဆိုပါ အမျိုးသမီး၏ ထောက်ပံ့ငွေများဖြင့် နေထိုင်စားသောက်ခဲ့သည်။ 

ထို့နောက် မွန်မင်းသမီးနှင့် ကွဲကွာခဲ့ပြီး ယခုလက်ရှိ ပေါင်းသင်းနေသော လေပြေ ခေါ် ရီရီနွယ်အပါအဝင်  မယား ၄ ဦးကို ပေါင်းသင်းခဲ့သည်။ လက်ရှိ ဇနီးယား လေပြေခေါ် ရီရီနွယ် သည် ခင်ပွန်း ၄ ဦးပြောင်းခဲ့ပြီး ဝင်းကိုကို လတ်သည် နောက်ဆုံးခင်ပွန်းဖြစ်သည်။  

မြောက်ဒဂုံတွင် ပထမခင်ပွန်းအဖြစ် ရဲတစ်ဦး၊ ယင်းနောက် စစ်မှုထမ်းဟောင်း တစ်ဦးကို ဒုတိယခင်ပွန်းအဖြစ်လည်းကောင်း၊ တတိယခင်ပွန်းအဖြစ်  ဒုတိယ ခင်ပွန်း၏ ဖခင်ကိုလည်းကောင်း လက်ထပ် ပေါင်းသင်းခဲ့သည်။ 

နောက်ဆုံးတွင် ဝင်းကိုကိုလတ်(ခ) စွေစောင်းကို လေပြေ ခေါ် ရီရီနွယ်က ၄ ဦးမြောက် ခင်ပွန်းအဖြစ် လက်ထပ်ခဲ့ခြင်းဖြစ်သည်။ 

ဝင်းကိုကိုလတ်၏ မူလအကိုင်အကိုင်သည် ပြည့်တန်ဆာများကို ချိတ် ဆက် ပေးခြင်း၊ အပြာစာအုပ်များ ရေးသားခြင်း  အလှပြင်ဆိုင် ဘန်းပြပြီး 2D 3 D အလောင်းကစားများကို လုပ်ကိုင်နေသူလည်းဖြစ်သည်။

စစ်တပ်က လိုသလို ပုံသွင်းခြင်း
=================

စစ်တပ်က မဘသ၊ အမျိုးသားရေးအစွန်းရောက်များ မွေးထုတ်ရာတွင်  ဝင်းကိုကိုလတ်ကဲ့သို့ အပြာ စာရေးဆရာနှင့် ပြည့်တန်ဆာခေါင်းမှ စ၍ မလွတ်ဘဲ စစ်တပ်က ငွေပေး၍ လိုအပ်သလို ပုံသွင်းယူ ကြသည်။  တိုင်းပြည် မငြိမ်မသက် ဖြစ်ရေန် အမျိုးမျိုး ကြိုးစားကြသည်။  

ဝင်းကိုကိုလတ်သည် အမျိုးသားရေး အစွန်းရောက် လှုပ်ရှားမှုများကို  ဦးဆောင်၍ ငွေကြေးအတွက် အဓိက လှုပ်ရှားခဲ့သည်။    ယခင် မြောက်ဒဂုံရဲစခန်းတွင် ဝင်းကိုကိုလတ်နှင့် ဇနီးကို ကျော်စာနှင့် လူမိုက်နာမည်ပျက်စာရင်း သွင်းထားခဲ့သော်လည်း အမျိုးသားရေး စလှုပ်ရှားချိန်တွင် ထိုအမည်ပျက်စာရင်းမှ ပယ်ဖျက်ပေးခြင်းခံရသည်။ 

 အမျိုးသားရေးအစွန်းရောက် သပိတ်နှင့်ပွဲမှန်သမျှ ဝင်းကိုကိုလတ် တက် သည်ဖြစ်စေ၊ မတက်သည်ဖြစ်စေ ဝေစု ပေးကြရသည်။ 

၂၀၁၇ ခုနှစ် ကြေးသွန်းဘုရားရှေ့ NLD အစိုးရ ဖြုတ်ချရေး သပိတ်ပွဲလုပ်ချိန် ဝင်းကိုကိုလတ် ထောင်ကျ နေသော်လည်း  သူ့အတွက် စပွန်ဆာကြေး ဝေစုကို သူ့ဇနီး လေပြေ ခေါ် ရီနွယ်အောင် ထံသို့ ပို့ပေးရသည်။

